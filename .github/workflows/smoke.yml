name: smoke
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
