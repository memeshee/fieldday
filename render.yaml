services:
  - type: web
    name: fieldday
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    # Secrets are NEVER committed here — set them in the Render dashboard
    # (or via API); sync:false means deploys won't overwrite dashboard values.
    envVars:
      - key: TABPFN_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
